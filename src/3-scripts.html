/* ---------- text splitting ---------- */
function splitChars(el,wv){
  var text=el.textContent;el.textContent='';var out=[],idx=0;
  text.split('').forEach(function(c){
    if(c===' '){el.appendChild(document.createTextNode(' '));return;}
    var s=document.createElement('span');s.className='ch';s.textContent=c;s.style.setProperty('--w',wv||100);s.dataset.i=idx++;
    el.appendChild(s);out.push(s);
  });
  return out;
}
function splitWordsMask(el){
  var words=el.textContent.trim().split(/\s+/);el.textContent='';var out=[];
  words.forEach(function(w,i){
    var o=document.createElement('span');o.className='wm';
    var n=document.createElement('span');n.className='wi';n.textContent=w;
    o.appendChild(n);el.appendChild(o);out.push(n);
    if(i<words.length-1)el.appendChild(document.createTextNode(' '));
  });
  return out;
}
function splitWordChars(el){
  var words=el.textContent.trim().split(/\s+/);el.setAttribute('aria-label',words.join(' '));el.textContent='';var out=[];
  words.forEach(function(w,i){
    var o=document.createElement('span');o.className='wm';o.setAttribute('aria-hidden','true');
    w.split('').forEach(function(c){var s=document.createElement('span');s.className='ch';s.style.setProperty('--w',100);s.textContent=c;o.appendChild(s);out.push(s);});
    el.appendChild(o);if(i<words.length-1)el.appendChild(document.createTextNode(' '));
  });
  return out;
}
$$('.hero .nl').forEach(function(l){splitChars(l,100);});

/* ---------- smooth scroll ---------- */

  gsap.registerPlugin(ScrollTrigger);

    lenis=new Lenis({lerp:.095,wheelMultiplier:1});

    gsap.ticker.lagSmoothing(0);
  }
}
window.scrollTo(0,0);

/* ---------- nav, progress, active link ---------- */
var nav=$('#nav'),prog=$('#progress'),lastY=0,menuOpen=false,ticking=false;
function onScroll(){
  if(ticking)return;ticking=true;
  requestAnimationFrame(function(){
    var y=window.scrollY||doc.scrollTop,max=Math.max(1,doc.scrollHeight-window.innerHeight);
    nav.classList.toggle('is-solid',y>30);
    if(!menuOpen){
      if(y>lastY+6&&y>520)nav.classList.add('is-hidden');
      else if(y<lastY-6||y<520)nav.classList.remove('is-hidden');
    }
    lastY=y;prog.style.transform='scaleX('+Math.min(1,y/max)+')';ticking=false;
  });
}
window.addEventListener('scroll',onScroll,{passive:true});
nav.addEventListener('focusin',function(){nav.classList.remove('is-hidden');});
if('IntersectionObserver' in window){
  var linkMap={};$$('.links a').forEach(function(a){linkMap[a.getAttribute('href').slice(1)]=a;});
  var io=new IntersectionObserver(function(entries){
    entries.forEach(function(e){if(!e.isIntersecting)return;$$('.links a').forEach(function(a){a.removeAttribute('aria-current');});if(linkMap[e.target.id])linkMap[e.target.id].setAttribute('aria-current','true');});
  },{rootMargin:'-45% 0px -50% 0px'});
  ['top','about','services','work','experience','contact'].forEach(function(id){var s=document.getElementById(id);if(s)io.observe(s);});
}

/* ---------- menu ---------- */
var menu=$('#menu'),menuBtn=$('#menuBtn');
function setMenu(open){
  menuOpen=open;menu.classList.toggle('is-open',open);menuBtn.setAttribute('aria-expanded',open?'true':'false');
  $('.mb-t',menuBtn).textContent=open?'Close':'Menu';
  if(open){menu.removeAttribute('inert');nav.classList.remove('is-hidden');if(lenis)lenis.stop();else doc.style.overflow='hidden';}
  else{menu.setAttribute('inert','');if(lenis)lenis.start();else doc.style.overflow='';}
}
menuBtn.addEventListener('click',function(){setMenu(!menuOpen);});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&menuOpen){setMenu(false);menuBtn.focus();}});

/* ---------- anchor scrolling ---------- */
document.addEventListener('click',function(e){
  var a=e.target.closest('a[href^="#"]');if(!a)return;
  var id=a.getAttribute('href');if(id.length<2)return;
  var t=document.querySelector(id);if(!t)return;
  e.preventDefault();if(menuOpen)setMenu(false);
  if(lenis)lenis.scrollTo(t,{duration:1.6,easing:function(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}});
  else t.scrollIntoView({behavior:reduce?'auto':'smooth'});
  if(id!=='#top'){t.setAttribute('tabindex','-1');setTimeout(function(){t.focus({preventScroll:true});},reduce?0:1200);}
});

/* ---------- clock ---------- */
var clock=$('#clock');
function tickClock(){try{clock.textContent=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kolkata',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date())+' IST';}catch(e){}}
tickClock();setInterval(tickClock,15000);

/* ---------- scrambling role ---------- */
var roleEl=$('#roleVar');
var SITE=(function(){try{return JSON.parse(document.getElementById('siteData').textContent);}catch(e){return{};}})();
var PHRASES=(SITE.phrases&&SITE.phrases.length)?SITE.phrases:[roleEl?roleEl.textContent:''];
var GLYPHS='<>/\\[]{}=+*^#01';
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function scramble(el,to){
  var tok=el._scr=(el._scr||0)+1;
  var from=el.textContent,len=Math.max(from.length,to.length),q=[],frame=0;
  for(var i=0;i<len;i++){var st=Math.floor(Math.random()*22);q.push({f:from[i]||'',t:to[i]||'',s:st,e:st+10+Math.floor(Math.random()*22),c:''});}
  (function step(){
    if(el._scr!==tok)return;
    var html='',done=0;
    for(var i=0;i<q.length;i++){var o=q[i];
      if(frame>=o.e){done++;html+=esc(o.t);}
      else if(frame>=o.s){if(!o.c||Math.random()<.3)o.c=GLYPHS[Math.floor(Math.random()*GLYPHS.length)];html+='<span class="scr">'+esc(o.c)+'</span>';}
      else html+=esc(o.f);}
    el.innerHTML=html;frame++;if(done<q.length)requestAnimationFrame(step);
  })();
}
if(!reduce){var pi=0;setInterval(function(){if(document.hidden||window.scrollY>window.innerHeight)return;pi=(pi+1)%PHRASES.length;scramble(roleEl,PHRASES[pi]);},3600);}

/* ---------- WebGL helpers ---------- */
function glProgram(g,vsrc,fsrc){
  function sh(type,src){var s=g.createShader(type);g.shaderSource(s,src);g.compileShader(s);if(!g.getShaderParameter(s,g.COMPILE_STATUS)){if(window.console)console.warn(g.getShaderInfoLog(s));return null;}return s;}
  var v=sh(g.VERTEX_SHADER,vsrc),f=sh(g.FRAGMENT_SHADER,fsrc);if(!v||!f)return null;
  var p=g.createProgram();g.attachShader(p,v);g.attachShader(p,f);g.linkProgram(p);
  if(!g.getProgramParameter(p,g.LINK_STATUS)){if(window.console)console.warn(g.getProgramInfoLog(p));return null;}
  return p;
}
function hexRGB(cs,name){var h=cs.getPropertyValue(name).trim().replace('#','');if(h.length===3)h=h.replace(/./g,'$&$&');var v=parseInt(h,16);return isNaN(v)?null:[(v>>16&255)/255,(v>>8&255)/255,(v&255)/255];}

  'varying float vGlow;varying float vHeat;varying float vAlpha;varying float vWarm;',

  '  float t=uTime;',
  '  float st=clamp(uStage+(aRnd.x-0.5)*0.9*sin(3.14159*fract(uStage)),0.0,4.0);',
  '  float w0=ez(tri(st)+tri(st-4.0));float w1=ez(tri(st-1.0));float w2=ez(tri(st-2.0));float w3=ez(tri(st-3.0));',
  '  float ws=max(w0+w1+w2+w3,0.0001);w0/=ws;w1/=ws;w2/=ws;w3/=ws;',

  '  if(w0>0.001){',

  '    vec2 dm=xz-uMouse.xy;float m=exp(-dot(dm,dm)*0.3)*uMouse.z;y+=m*0.6;',
  '    float g=0.0;',
  '    for(int i=0;i<4;i++){vec4 pg=uPing[i];if(pg.w>0.0){float age=t-pg.z;if(age>0.0){float k=length(xz-pg.xy)-age*3.4;float ring=exp(-k*k*1.6)*pg.w*exp(-age*0.28);y+=ring*0.5;g+=ring;}}}',

  'uniform vec2 uSunPos;uniform float uSunI;uniform float uTime;uniform float uAsp;uniform float uVig;uniform float uGrain;uniform float uLight;',

  'void main(){',
  '  vec2 uv=vUv;',

    }
    measureReel();ScrollTrigger.addEventListener('refresh',measureReel);gsap.ticker.add(reel);
    return function(){gsap.ticker.remove(reel);ScrollTrigger.removeEventListener('refresh',measureReel);work.classList.remove('h-on');gsap.set(track,{clearProps:'transform'});gsap.set(projs,{clearProps:'transform,opacity'});};
  });
  mm.add('(max-width: 899px)',function(){
    projs.forEach(function(p){
      gsap.fromTo($('.proj-vis',p),{clipPath:'inset(12% 8% 12% 8% round 14px)'},{clipPath:'inset(0% 0% 0% 0% round 14px)',duration:1.5,ease:'expo.out',scrollTrigger:{trigger:p,start:'top 85%',once:true}});
      gsap.from($$('.proj-text > *',p),{y:36,opacity:0,duration:1.1,ease:'expo.out',stagger:.05,scrollTrigger:{trigger:$('.proj-text',p),start:'top 88%',once:true}});
    });
  });

  $$('[data-row]').forEach(function(row){
    var line=$('.line',row),kids=Array.prototype.filter.call(row.children,function(c){return c!==line;});
    var tl=gsap.timeline({scrollTrigger:{trigger:row,start:'top 88%',once:true}});
    tl.fromTo(line,{scaleX:0},{scaleX:1,duration:1.4,ease:'expo.inOut'},0)
      .from(kids,{y:30,opacity:0,duration:1.1,ease:'expo.out',stagger:.08},.25);
    var chips=$$('.chip',row);if(chips.length)tl.from(chips,{y:16,opacity:0,scale:.9,duration:.8,ease:'back.out(2)',stagger:.035},.35);
  });

  var ct=$('#contact-h'),cc=splitWordChars(ct);
  gsap.fromTo(cc,{yPercent:115,'--w':40},{yPercent:0,'--w':100,duration:1.5,ease:'expo.out',stagger:.022,scrollTrigger:{trigger:ct,start:'top 82%',once:true}});

  gsap.from(markChars,{yPercent:100,opacity:0,duration:1.4,ease:'expo.out',stagger:.04,scrollTrigger:{trigger:'#mark',start:'top 95%',once:true}});
}

/* ---------- boot ---------- */
if(reduce){$$('svg').forEach(function(s){if(s.pauseAnimations)s.pauseAnimations();});}
scrollScenes();
runLoader(intro);
if(hasGsap){
  var refresh=function(){ScrollTrigger.refresh();};
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(refresh);
  window.addEventListener('load',refresh);
}
onScroll();
})();
</script>
